# Deploys the demo to Azure Container Apps (I1; docs/superpowers/plans/2026-11-11-i1-azure-infra.md Task 5 and
# docs/superpowers/plans/2026-11-15-i1-plan-deltas.md). Runs after `ci` succeeds on a push to main, or by hand
# (`gh workflow run deploy.yml`). Nothing here has run against Azure yet.
#
# Order: build-api and build-web (in parallel) -> deploy. `deploy` is TWO Bicep deployments with the migration between:
#   phase 1 (DEPLOY_APPS=false)  environment, logging, Postgres, job-migrate
#   run-migrate.sh               the api must never start against an unmigrated schema
#   phase 2 (DEPLOY_APPS=true)   api (private), web (public), alerts (worker)
# then the checks that the deployment is the code just built: the database TLS settings still verify the server (ADR 0042),
# a revision gate per app; then restart-apps.sh (a rotated secret VALUE reaches replicas only after a restart), wait-ready.sh
# (the api may be cold), a demo reset (a fresh epoch), the smoke test, and a final demo reset. A step that fails stops the run:
# nothing rolls back (single-revision mode keeps the old revision serving while a new one is not ready).
# infra/scripts/check-workflow.sh pins this order.
#
# CHEAP MODE (architect ruling 2026-11-15): the deployment is cheap by default (infra/bicep/main.bicep has the sizes and the
# prices). The api is INTERNAL and scales to ZERO when idle (API_MIN_REPLICAS=0, the default), so its first request after about
# five idle minutes meets a cold start: the gates, restart, reset and smoke test below all allow for it (the api gate takes
# --allow-zero-replicas, the restart skips an api that has no replica, wait-ready.sh and smoke-http.sh poll until it answers).
# Set the variable to 1 to keep the api warm.
#
# GitHub environment `demo` (Settings > Environments). Its OIDC subject is `repo:<owner>/<repo>:environment:demo`
# (infra/README.md). Restrict its deployment branches to `main`.
#   Variables
#     AZURE_CLIENT_ID  AZURE_TENANT_ID  AZURE_SUBSCRIPTION_ID   the deployer identity (bootstrap.bicep outputs)
#     AZURE_RESOURCE_GROUP                                       the resource group of main.bicep
#     ACR_NAME                                                   the registry (login server is <ACR_NAME>.azurecr.io)
#     APPS_IDENTITY_ID                                           resource id of the apps identity (bootstrap output)
#     POSTGRES_VERSION                                           17 or 18 (infra/scripts/preflight.sh decides)
#     VAPID_PUBLIC_KEY  VAPID_SUBJECT                            Web Push public key and its mailto: subject
#     API_MIN_REPLICAS                                           optional; 0 (default, the api scales to zero) or 1 (kept warm)
#     SB_RULESET_ID  SB_MODEL_ID                                 optional; leave UNSET (the backend refuses both in prod)
#     NEXT_PUBLIC_SB_DEMO                                        optional; a BUILD argument of the web image. Unset or empty
#                                                                is demo mode, the safe default: never set it to `0`.
#   Secrets (they reach Bicep only as environment variables read by readEnvironmentVariable in main.bicepparam; none is
#   echoed or put on a command line)
#     PG_ADMIN_PASSWORD  VAPID_PRIVATE_KEY  SB_ACCESS_TOKENS  DEMO_EMPLOYER_TOKEN
# A real image is built only when backend/Dockerfile or frontend/Dockerfile exists; otherwise resolve-image.sh answers
# with a public quickstart placeholder, nothing is built or migrated, and the smoke test runs with --placeholder.
name: deploy
on:
  # Only a successful run of `ci` for a PUSH to main. The `event == 'push'` test is not optional: a pull request from a fork
  # whose branch is called `main` also produces a workflow_run with head_branch `main`, and this workflow would then build
  # that code with the environment's secrets.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # the OIDC token for azure/login
concurrency:
  group: deploy-demo
  cancel-in-progress: false
env:
  # `azure/login` warns that a command's output can carry a secret into the log. Commands that need output pass `-o tsv`
  # and a --query, which outrank this.
  AZURE_CORE_OUTPUT: none
  GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
defaults:
  run:
    shell: bash # -eo pipefail; the default `bash -e` would hide a failure on the left of a pipe
jobs:
  build-api:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # the image is 1.8 GB on disk; it is built, loaded, checked and pushed
    environment: demo
    outputs:
      image: ${{ steps.img.outputs.image }}
      port: ${{ steps.img.outputs.port }}
      live: ${{ steps.img.outputs.live }}
      ready: ${{ steps.img.outputs.ready }}
      health: ${{ steps.img.outputs.health }}
      placeholder: ${{ steps.img.outputs.placeholder }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve the image
        id: img
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
        run: bash infra/scripts/resolve-image.sh api backend "$GIT_SHA" "$ACR_LOGIN_SERVER"

      - name: Azure login
        if: steps.img.outputs.placeholder == 'false'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az acr login` leaves a registry token for Docker in ~/.docker/config.json (valid for hours), which is all the image
      # upload and the build action need. The Azure session itself is the deployer identity with Contributor on the group, so
      # it is dropped before third-party build actions run. The azure/login post step only runs `az account clear`, which
      # succeeds with no account.
      - name: Log in to the registry, then drop the Azure session
        if: steps.img.outputs.placeholder == 'false'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          az logout

      - name: Set up Buildx
        if: steps.img.outputs.placeholder == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # load: true and push: false leave the image in the LOCAL daemon: the next step runs it (`docker run --pull never`), and
      # it is pushed only after that check passes. (The action adds no provenance attestation to a loaded image.)
      - name: Build the api image (into the local daemon, not pushed)
        if: steps.img.outputs.placeholder == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.img.outputs.image }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ADR 0042: the image's root store, loaded from PGSSLROOTCERT, must hold both roots Microsoft names for Azure Database
      # for PostgreSQL, or verify-full cannot succeed in production.
      - name: Check the database root certificates in the image (ADR 0042)
        if: steps.img.outputs.placeholder == 'false'
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: bash infra/scripts/check-db-tls.sh --image "$IMAGE"

      - name: Push the api image
        if: steps.img.outputs.placeholder == 'false'
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: docker push "$IMAGE"

  build-web:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # the build can take 10 minutes on a slow network
    environment: demo
    outputs:
      image: ${{ steps.img.outputs.image }}
      port: ${{ steps.img.outputs.port }}
      live: ${{ steps.img.outputs.live }}
      ready: ${{ steps.img.outputs.ready }}
      health: ${{ steps.img.outputs.health }}
      placeholder: ${{ steps.img.outputs.placeholder }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve the image
        id: img
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
        run: bash infra/scripts/resolve-image.sh web frontend "$GIT_SHA" "$ACR_LOGIN_SERVER"

      - name: Azure login
        if: steps.img.outputs.placeholder == 'false'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az acr login` leaves a registry token for Docker in ~/.docker/config.json (valid for hours), which is all the image
      # upload and the build action need. The Azure session itself is the deployer identity with Contributor on the group, so
      # it is dropped before third-party build actions run. The azure/login post step only runs `az account clear`, which
      # succeeds with no account.
      - name: Log in to the registry, then drop the Azure session
        if: steps.img.outputs.placeholder == 'false'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          az logout

      - name: Set up Buildx
        if: steps.img.outputs.placeholder == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # NEXT_PUBLIC_SB_DEMO is inlined into the client bundle at build time (frontend/Dockerfile): empty is demo mode, the
      # safe default, so an unset variable is passed through as empty and never replaced by `0`. provenance: false keeps this
      # image a plain single manifest like the api image, which `docker push` sends without an attestation.
      - name: Build and push the web image
        if: steps.img.outputs.placeholder == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: frontend
          push: true
          provenance: false
          tags: ${{ steps.img.outputs.image }}
          build-args: |
            APP_VERSION=${{ env.GIT_SHA }}
            NEXT_PUBLIC_SB_DEMO=${{ vars.NEXT_PUBLIC_SB_DEMO }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [build-api, build-web]
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # Postgres creation alone takes 5 to 15 minutes; the gates wait for revisions
    environment: demo
    env:
      # Every non-secret value of infra/bicep/main.bicepparam. The four secrets are set only on the steps that need them.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      APPS_IDENTITY_ID: ${{ vars.APPS_IDENTITY_ID }}
      POSTGRES_VERSION: ${{ vars.POSTGRES_VERSION }}
      API_IMAGE: ${{ needs.build-api.outputs.image }}
      API_TARGET_PORT: ${{ needs.build-api.outputs.port }}
      API_LIVE_PATH: ${{ needs.build-api.outputs.live }}
      API_READY_PATH: ${{ needs.build-api.outputs.ready }}
      API_IS_PLACEHOLDER: ${{ needs.build-api.outputs.placeholder }}
      WEB_IMAGE: ${{ needs.build-web.outputs.image }}
      WEB_TARGET_PORT: ${{ needs.build-web.outputs.port }}
      WEB_HEALTH_PATH: ${{ needs.build-web.outputs.health }}
      WEB_IS_PLACEHOLDER: ${{ needs.build-web.outputs.placeholder }}
      JOBS_IMAGE: mcr.microsoft.com/k8se/quickstart-jobs:latest
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      SB_RULESET_ID: ${{ vars.SB_RULESET_ID }}
      SB_MODEL_ID: ${{ vars.SB_MODEL_ID }}
      TRUSTED_PROXY_HOPS: "1" # Container Apps ingress provides only the rightmost X-Forwarded-For entry
      API_MIN_REPLICAS: ${{ vars.API_MIN_REPLICAS || '0' }} # 0 = the api scales to zero (cheap mode), 1 = kept warm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Names what is missing, never a value. A real api needs the access tokens, a real web the demo token, and the VAPID
      # private key needs its subject and public key (the backend takes both or neither).
      - name: Check the configuration is set
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SB_ACCESS_TOKENS: ${{ secrets.SB_ACCESS_TOKENS }}
          DEMO_EMPLOYER_TOKEN: ${{ secrets.DEMO_EMPLOYER_TOKEN }}
        run: |
          . infra/scripts/lib.sh
          require_env AZURE_RESOURCE_GROUP ACR_NAME APPS_IDENTITY_ID POSTGRES_VERSION PG_ADMIN_PASSWORD \
            API_IMAGE API_TARGET_PORT API_LIVE_PATH API_READY_PATH API_IS_PLACEHOLDER \
            WEB_IMAGE WEB_TARGET_PORT WEB_HEALTH_PATH WEB_IS_PLACEHOLDER
          if [ "$API_IS_PLACEHOLDER" = false ]; then require_env SB_ACCESS_TOKENS; fi
          if [ "$WEB_IS_PLACEHOLDER" = false ]; then require_env DEMO_EMPLOYER_TOKEN; fi
          if [ -n "${VAPID_PRIVATE_KEY:-}" ]; then require_env VAPID_SUBJECT VAPID_PUBLIC_KEY; fi
          case "$API_MIN_REPLICAS" in 0 | 1) ;; *) die "API_MIN_REPLICAS must be 0 or 1, got '$API_MIN_REPLICAS'" ;; esac

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned and checked against the digest GitHub publishes for the v0.49.2 asset bicep-linux-x64 (GitHub API, 2026-11-15);
      # `az bicep install` does not verify what it downloads. BICEP_BIN makes the infra scripts use this copy and not the one on
      # the runner's PATH. The same pair as in ci.yml: change them together.
      - name: Install Bicep (pinned, checksum verified)
        run: |
          sha256=0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5
          az bicep install --version v0.49.2
          echo "${sha256}  ${HOME}/.azure/bin/bicep" | sha256sum -c -
          echo "BICEP_BIN=${HOME}/.azure/bin/bicep" >> "$GITHUB_ENV"

      # run-migrate.sh and healthcheck.sh use `az containerapp`. Not pinned (a version is a separate decision: parking lot).
      - name: Install the containerapp extension
        run: az extension add --name containerapp --upgrade --yes --only-show-errors

      - name: Template checks (database TLS, then the template assertions)
        run: |
          bash infra/scripts/check-db-tls.sh --template infra/bicep/main.bicep
          bash infra/scripts/check-template.sh infra/bicep/main.bicep

      # What-if only makes sure the template and the parameters evaluate and the deployment is accepted. `-o none` prints
      # nothing; the exit status carries a template error.
      - name: Phase 1 what-if (environment, database, migrate job)
        env:
          DEPLOY_APPS: "false"
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/bicep/main.bicepparam --only-show-errors -o none

      - name: Phase 1 deploy (environment, database, migrate job)
        timeout-minutes: 45
        env:
          DEPLOY_APPS: "false"
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" --name "main-p1-${GIT_SHA::12}" \
            --parameters infra/bicep/main.bicepparam --only-show-errors -o none

      # job-migrate is defined by phase 1; the script checks its image, starts it, polls and retries once (the AcrPull role
      # can take minutes to apply on a first pull). With a placeholder api there is no schema to migrate.
      - name: Migrate the database
        if: needs.build-api.outputs.placeholder == 'false'
        timeout-minutes: 30
        run: bash infra/scripts/run-migrate.sh "$AZURE_RESOURCE_GROUP" "$API_IMAGE" "$API_IS_PLACEHOLDER"

      # After phase 1 and the migration, so the environment and the database the apps refer to exist.
      - name: Phase 2 what-if (api, web, alerts)
        env:
          DEPLOY_APPS: "true"
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SB_ACCESS_TOKENS: ${{ secrets.SB_ACCESS_TOKENS }}
          DEMO_EMPLOYER_TOKEN: ${{ secrets.DEMO_EMPLOYER_TOKEN }}
        run: |
          az deployment group what-if --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/bicep/main.bicepparam --only-show-errors -o none

      - name: Phase 2 deploy (api, web, alerts)
        timeout-minutes: 30
        env:
          DEPLOY_APPS: "true"
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SB_ACCESS_TOKENS: ${{ secrets.SB_ACCESS_TOKENS }}
          DEMO_EMPLOYER_TOKEN: ${{ secrets.DEMO_EMPLOYER_TOKEN }}
        run: |
          az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" --name "main-p2-${GIT_SHA::12}" \
            --parameters infra/bicep/main.bicepparam --only-show-errors -o none

      # ADR 0042 again, on what was deployed: the stored secret and the environment still verify the server. A placeholder
      # api has neither the secret nor the environment (main.bicep), so there is nothing to check.
      - name: Database TLS as deployed (ADR 0042)
        if: needs.build-api.outputs.placeholder == 'false'
        run: bash infra/scripts/check-db-tls.sh --deployed "$AZURE_RESOURCE_GROUP"

      - name: Read the web address
        run: |
          fqdn="$(az deployment group show --resource-group "$AZURE_RESOURCE_GROUP" --name "main-p2-${GIT_SHA::12}" \
            --query properties.outputs.webFqdn.value -o tsv)"
          case "$fqdn" in
            "" | *[!A-Za-z0-9.-]*)
              echo "the deployment main-p2-${GIT_SHA::12} has no usable webFqdn output" >&2
              exit 1
              ;;
            *) ;;
          esac
          echo "WEB_FQDN=$fqdn" >> "$GITHUB_ENV"

      # The api is PRIVATE (internal ingress): it is gated on its revision state alone, not on an HTTP call from here. With
      # API_MIN_REPLICAS=0 it may have no replica yet: the gate then needs the revision ready, the image and Provisioned (a
      # failed rollout fails the first two) and prints `scaled to zero`; with a replica every rule applies. The web gate is the
      # BFF's own health route, which a placeholder web (a quickstart page) does not have.
      - name: Gate api (revision state)
        timeout-minutes: 30
        run: |
          flags=()
          if [ "$API_MIN_REPLICAS" = 0 ]; then flags+=(--allow-zero-replicas); fi
          bash infra/scripts/healthcheck.sh --app api --rg "$AZURE_RESOURCE_GROUP" --image "$API_IMAGE" ${flags[@]+"${flags[@]}"}

      - name: Gate web (revision state and /api/healthz)
        timeout-minutes: 30
        run: |
          args=(--app web --rg "$AZURE_RESOURCE_GROUP" --image "$WEB_IMAGE" --url "https://${WEB_FQDN}${WEB_HEALTH_PATH}")
          if [ "$WEB_IS_PLACEHOLDER" = false ]; then
            args+=(--expect-json-key status --expect-json-value ok)
          fi
          bash infra/scripts/healthcheck.sh "${args[@]}"

      # The worker has no ingress and runs the api image; a placeholder api gets no worker (main.bicep).
      - name: Gate alerts (revision state, no ingress)
        if: needs.build-api.outputs.placeholder == 'false'
        timeout-minutes: 30
        run: bash infra/scripts/healthcheck.sh --app alerts --rg "$AZURE_RESOURCE_GROUP" --image "$API_IMAGE" --no-ingress

      # Container Apps creates no revision when only secret VALUES change, so a rotated secret reaches the running replicas only
      # after a restart (restart-apps.sh restarts api, alerts and web together and waits for the revision gates again; an api
      # that has no replica is skipped: it reads its secrets at its next cold start).
      - name: Restart the apps (rotated secrets reach the replicas only after a restart)
        if: needs.build-api.outputs.placeholder == 'false'
        timeout-minutes: 30
        run: bash infra/scripts/restart-apps.sh "$AZURE_RESOURCE_GROUP"

      # With the api scaled to zero the web BFF answers an error for the first seconds of a request (it gives up on the api
      # after 10 s), so wait until the api has started before the reset, which goes through the BFF as well. Placeholders have no
      # such route.
      - name: Wait for the api to answer through the web (cold start)
        if: needs.build-api.outputs.placeholder == 'false' && needs.build-web.outputs.placeholder == 'false'
        timeout-minutes: 10
        run: bash infra/scripts/wait-ready.sh "https://$WEB_FQDN" --timeout 300

      # A fresh demo epoch (through the public web URL, which injects the demo token itself), so the smoke test's replay-clock
      # window check (H4) is meaningful: since B3's epoch clock, `sb-jobs site load` starts the epoch at the FIRST deploy only.
      - name: Reset the demo (a fresh epoch for the smoke test)
        if: needs.build-api.outputs.placeholder == 'false' && needs.build-web.outputs.placeholder == 'false'
        timeout-minutes: 5
        run: bash infra/scripts/reset-demo.sh "https://$WEB_FQDN"

      # Its H6 drains the BFF rate-limit bucket and the script waits that out by default (about a minute).
      - name: Smoke test
        id: smoke
        timeout-minutes: 30
        run: |
          flags=(--api-min "$API_MIN_REPLICAS")
          if [ "$API_IS_PLACEHOLDER" = true ]; then flags+=(--placeholder); fi
          bash infra/scripts/smoke.sh "$AZURE_RESOURCE_GROUP" "${flags[@]}" | tee "$RUNNER_TEMP/smoke.txt"

      # Leaves a clean epoch for whoever opens the demo next: the smoke test's stop and its undo belong to the epoch, and a reset
      # is limited upstream to 1 per 60 s, so a 429 is waited out once. Runs after a failed smoke test as well (its recovery
      # for a stop left behind is exactly a reset).
      - name: Reset the demo again (leave a clean epoch)
        if: always() && steps.smoke.outcome != 'skipped' && needs.build-api.outputs.placeholder == 'false' && needs.build-web.outputs.placeholder == 'false'
        timeout-minutes: 5
        run: bash infra/scripts/reset-demo.sh "https://$WEB_FQDN" --retry-after-once

      # The web URL and the smoke result lines only: the api is private, so it has no URL worth publishing. Kept even when the
      # smoke test failed, and filtered to the result lines.
      - name: Summary
        if: always() && steps.smoke.outcome != 'skipped'
        run: |
          {
            echo "### Demo deploy ${GIT_SHA::12}"
            echo
            echo "- web: https://${WEB_FQDN}"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/smoke.txt" ]; then
              grep -E '^(PASS|FAIL|SKIP|WARN)' "$RUNNER_TEMP/smoke.txt" | grep -v '\.internal\.' || true
            else
              echo "the smoke test produced no output"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
