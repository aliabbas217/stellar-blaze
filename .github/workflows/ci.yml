name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    # Raised from 15 for the browser install, e2e (35 s on a laptop) and Lighthouse (77 s, plus a cold `pnpm dlx` of about 50 s).
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      # package_json_file defaults to the repo-root package.json; this repo keeps it under frontend/.
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Regenerates src/api/schema.d.ts from the OpenAPI source and fails when it differs from the committed file.
      - run: pnpm api:check
      - run: pnpm test
      - run: pnpm build
      # The full Chromium (not the headless shell): the push tests need a browser that honours a notification permission grant.
      - run: pnpm exec playwright install --with-deps chromium
      # Starts the mock API and the standalone production server itself (webServer in playwright.config.ts).
      - run: pnpm e2e
      - run: pnpm design:lint
      # Starts the same stack (scripts/serve-stack.mjs), then audits /en/worker and /en/worker/alerts against the budgets in lighthouserc.json.
      - run: pnpm dlx @lhci/cli@0.16.0 autorun
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: frontend-reports
          # .lighthouseci is a hidden folder: it is only uploaded with include-hidden-files.
          path: |
            frontend/playwright-report/
            frontend/.lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
