# TEMPORARY bench on the branch debug/ci-frontend (deleted with it). The frontend unit step as ci.yml runs it, twice in parallel, to
# confirm that the fix of the PlanView failure holds with the default timeouts and is not a lucky pass.
name: debug-frontend
on:
  push:
    branches: [debug/ci-frontend]
permissions:
  contents: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=4
