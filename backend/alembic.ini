# Alembic configuration. The database URL comes from env.py (Settings: SB_DATABASE_URL), not from this file.
# Run from backend/:  uv run alembic upgrade head

[alembic]
# %(here)s is the directory of this file, so the command works from any working directory.
script_location = %(here)s/alembic
# Files sort in revision order: 0001_create_job_run.py (use `alembic revision --rev-id NNNN -m "..."`).
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Keep generated migrations in the repository's own style (isort + format) so the pre-commit hooks leave them alone.
[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

# Logging goes to stderr: stdout carries the SQL of `alembic upgrade head --sql` (env.py reads these sections).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
