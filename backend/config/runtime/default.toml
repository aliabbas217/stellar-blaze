# Runtime configuration seed (ADR 0010): every value is the ruleset default except the two pinned ones: the released
# model (`model_id`, below) and the pre-registered theta_protect (`warning_theta`, under [tunables]).
#
# This is the git default that is loaded at startup, and that `sb-jobs config seed` (Task 7B) writes to the database as
# the first config version. A tunable is set only to move away from its ruleset default, within the range that the
# ruleset declares under [tunables.<name>]; legal floors are not settable here at all. A config WITHOUT `model_id`
# serves the uncorrected forecast (no corrector): that is not the product.

schema_version = 1

# The released model of the protocol lock (B2 owns it; the model is committed under backend/models/). Without this pin
# the corrector is absent, so the demo day 2025-07-10 comes out Green all day on the uncorrected forecast.
model_id = "corrector-20261114-d327987-6edafa"

[tunables]
# The pre-registered theta_protect (ADR 0048 section 3; freeze addendum section 2 in
# docs/research/2026-11-15-preregistration-freeze.md): the largest theta whose hour-weighted POD for truth-High hours
# is at least 0.90 (the weighted reading; the unweighted reading gives 0.35, published in the addendum). The ruleset
# default is 0.10 within [0.05, 0.50]. A fresh `sb-jobs config seed` therefore matches the frozen value.
warning_theta = 0.30

[flags]
