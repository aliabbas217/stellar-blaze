# ---- floors carried over from ae-heat-0.1 -------------------------------------------------------------------------

# NIOSH (2016) Table 3-2 clothing adjustment factors in degrees C WBGT, relative to work clothes (ACGIH-derived). The
# keys are the values of the Clothing enum (stellar_blaze.domain.physics.niosh); a test pins both.
[niosh_clothing]
source = "niosh-2016"
values_c = { work_clothes = 0.0, cloth_coveralls = 0.0, double_layer_woven = 3.0, sms_coveralls = 0.5, polyolefin_coveralls = 1.0, limited_use_vapor_barrier = 11.0 }

# ADOSH TWL zones in W/m2: at or above low_min is Low risk, from medium_min up to low_min is Medium, below medium_min is
# High (the Red stop edge is a tunable, [tunables.red_twl_w_m2]). The boundary convention (exactly 140 is Low, exactly
# 115 is Medium) is ours; the guideline prints "140 - 220 <", "115 - 140" and "< 115".
[twl_zones]
source = "adosh-twl"
low_min_w_m2 = 140.0
medium_min_w_m2 = 115.0

# Withdrawal limits ported from the reference TWL implementation. Off (ADR 0047): the only source is a third-party code
# comment, and a floor must cite law or a guideline.
[twl_withdrawal]
source = "meteohazard-5633d57"
enabled = false
dry_bulb_c = 44.0
natural_wet_bulb_c = 32.0
cap_w_m2 = 115.0

# ---- floors new in B3 ---------------------------------------------------------------------------------------------

# UAE labour law (ADR 0011 section 4, P-H1 to P-H6). Hours, not minutes. Both art18_*_counts_as_break switches are
# PROTECTIVE READINGS (counsel Q1): ban time and ADOSH cycle rest are not credited as the Art. 18 break.
[labour]
source = "fdl-33-2021"
ban_window = [12:30:00, 15:00:00]
ban_season = ["06-15", "09-15"]
normal_hours_per_day = 8
normal_hours_per_week = 48
overtime_hours_per_day = 2
total_hours_per_3_weeks = 144
art18_max_run_h = 5
art18_break_h = 1
art18_ban_gap_counts_as_break = false
art18_adosh_rest_counts_as_break = false
juvenile_max_h = 6
juvenile_max_run_h = 4
juvenile_window = [07:00:00, 19:00:00]
ramadan_reduction_h = 2

# ADOSH Technical Guideline Table 1 cycles in minutes. Low zone: no imposed cycle. Moderate work uses the heavy column
# (ADR 0046 decision 6, PROTECTIVE READING).
[adosh_cycles]
source = "adosh-twl"
medium_heavy_work_min = 45
medium_heavy_rest_min = 15
high_light_work_min = 45
high_light_rest_min = 15
high_heavy_work_min = 20
high_heavy_rest_min = 40
moderate_uses_heavy = true
lone_work_min_headcount = 2

# Technical Guideline section 3: percent of the full assignment by day. reacclimatisation_pct is "<band>.<day>", the band
# being the days-away row. The 4-5 day row prints "R/E*", undefined in the source: 80 then 100 is the PROTECTIVE READING
# (ADR 0011 P-H8).
[acclimatisation]
source = "adosh-tg-s3"
unacclimatised_after_days_away = 14
heavy_work_after_days = 7

[acclimatisation.new_ramp_pct]
"1" = 20
"2" = 40
"3" = 60
"4" = 80
"5" = 100

[acclimatisation.experienced_ramp_pct]
"1" = 50
"2" = 60
"3" = 80
"4" = 100
"5" = 100

[acclimatisation.reacclimatisation_pct]
"lt4.1" = 100
"4-5.1" = 80
"4-5.2" = 100
"6-12.1" = 80
"6-12.2" = 100
"12-20.1" = 60
"12-20.2" = 80
"12-20.3" = 100
"gt20.1" = 50
"gt20.2" = 60
"gt20.3" = 80
"gt20.4" = 100

# Metabolic rate in W per workload class (ADR 0006 NIOSH test vectors).
[workload]
source = "adr-0006"
metabolic_w = { light = 180.0, moderate = 300.0, heavy = 415.0 }

# Small-cell suppression floors (ADR 0050): the k tunables may not go below these.
[privacy]
source = "adr-0050"
k_health_floor = 10
k_exposure_floor = 5

# ---- citations and alert content (not floors) ---------------------------------------------------------------------

# The clause behind every rule id the planner and the validator cite. Legal wording is quoted verbatim from the
# research document; a rule that is a product rule or a PROTECTIVE READING says so.
[clauses]
source = "adr-0011"

[clauses.entries."P-H1"]
source = "mohre-mr-44-2022"
clause = 'Art. 3 Noon Work Ban: "All work performed directly under the sun and in open places shall not be allowed between the peak hours of 12.30 pm and 3 pm from June 15 to September 15 every year. No business shall be resumed before 3pm"'

[clauses.entries."P-H1a"]
source = "ad-19-2023"
clause = 'Art. 11 Prohibition of Work During the Midday: "For technical reasons, the following works are exempt and must continue uninterrupted"; "When technical reasons dictate the continuation of work, employers must provide workers with the following". The attested exempt_reason is a product rule (ADR 0011 P-H1a): an exemption is never inferred'

[clauses.entries."P-H2.daily"]
source = "fdl-33-2021"
clause = 'Art. 17(1): "The maximum normal working hours for workers shall be (8) eight hours per day or (48) forty-eight hours per week."; Art. 19(1): "do not exceed two hours per day" and "the total working hours shall not exceed (144) one hundred and forty four hours every (3) three weeks."'

[clauses.entries."P-H2.weekly"]
source = "fdl-33-2021"
clause = 'Art. 17(1): "The maximum normal working hours for workers shall be (8) eight hours per day or (48) forty-eight hours per week."; Art. 19(1): "the total working hours shall not exceed (144) one hundred and forty four hours every (3) three weeks."'

[clauses.entries."P-H3"]
source = "fdl-33-2021"
clause = 'Art. 18: "The worker may not work for more than (5) five consecutive hours without a break or breaks of not less than an hour in total, provided that these periods are not included in the working hours." PROTECTIVE READING (ADR 0011 P-H3): ban time and ADOSH cycle rest are not credited as the break'

[clauses.entries."P-H4"]
source = "fdl-33-2021"
clause = 'Art. 21: "The worker shall be granted a paid weekend of not less than one day, according to the employment contract or the work regulation." The one rest day in seven is the reading in ADR 0011 P-H4'

[clauses.entries."P-H5.hours"]
source = "fdl-33-2021"
clause = 'Art. 5(2)(c): "The actual working hours shall not exceed six hours per day and shall include one break or more, which shall not be less than one hour in total"; Art. 5(2)(f): "The juvenile shall not work overtime"'

[clauses.entries."P-H5.run"]
source = "fdl-33-2021"
clause = 'Art. 5(2)(c): "this period(s) shall be defined, so that the juvenile does not work for more than four consecutive hours."'

[clauses.entries."P-H5.window"]
source = "fdl-33-2021"
clause = 'Art. 5(2)(d): "The juvenile shall not work between 7 pm and 7 am."'

[clauses.entries."P-H7.cap60"]
source = "adosh-twl"
clause = 'Table 1: Medium Risk, heavy work "Continuous paced work 45 work - 15 rest"; High Risk "Strict Work/Rest cycling required", light work 45 work - 15 rest, heavy work 20 work - 40 rest. Moderate work uses the heavy column (PROTECTIVE READING, ADR 0046)'

[clauses.entries."P-H7.run"]
source = "adosh-twl"
clause = 'Table 1: Medium Risk, heavy work "Continuous paced work 45 work - 15 rest"; High Risk, light work 45 work - 15 rest, heavy work 20 work - 40 rest'

[clauses.entries."P-H7.lone"]
source = "adosh-twl"
clause = 'Table 1: Medium Risk "Working alone to be avoided"; High Risk "No person to work alone"'

[clauses.entries."P-H7.unacclimatised"]
source = "adosh-twl"
clause = 'Table 1: Medium Risk and High Risk "No unacclimatised person to work"; "Unacclimatised workers are defined as new workers or those who have been off work for more than 14 days due to illness or vacation leave (in a cool climate area)"'

[clauses.entries."P-H8.ramp"]
source = "adosh-tg-s3"
clause = 'Section 3 acclimatisation table: new employee 20% / 40% / 60% / 80% / 100% on days 1-5; experienced employee 50 / 60 / 80 / 100 / 100; re-acclimatisation by days away. The "R/E*" row (4-5 days) is read as 80 then 100 (PROTECTIVE READING, ADR 0011 P-H8)'

[clauses.entries."P-H8.heavy7"]
source = "adosh-cop-11"
clause = 'CoP 11.0 3.2(b)(i): "with an allowance of 5-7 days for acclimatization before starting hard work in a hot environment"; 7 days is the protective end (ADR 0011 P-H8)'

[clauses.entries."P-H10"]
source = "adr-0011"
clause = 'P-H10 No added minutes: a plan never schedules more work minutes per worker than the published shift and never extends it. Product rule, not law (ADR 0011 section 4)'

[clauses.entries."STOP.red"]
source = "adr-0046"
clause = 'Decisions 2 and 8: below the Red edge (red_twl_w_m2) every crew is stopped. POLICY, beyond the ADOSH table: stop work'

[clauses.entries."STOP.no_acclimatised"]
source = "adosh-twl"
clause = 'Table 1: Medium Risk and High Risk "No unacclimatised person to work"; a Medium or High tick is unworkable for a crew with no acclimatized member (ADR 0011 section 2 steps 4 and 6)'

[clauses.entries."FALLBACK.high"]
source = "adr-0058"
clause = 'Decision 4: with no usable forecast for an hour the hour is fallback and the planner treats every on-shift tick as High, never less protective than the ban (ADR 0011 P-H12)'

# Alert templates and the action codes shown per level (ADR 0058; ADOSH Table 1 interventions). Codes are stable
# identifiers; wording lives in the frontend.
[alerts]
source = "adr-0058"
template_ids = ["level-change", "level-end"]

[alerts.action_codes_by_level]
green = ["self-paced-work", "fluids.light.600ml-1l"]
amber = [
  "cycle.medium.heavy.45-15",
  "no-lone-work",
  "no-unacclimatised",
  "fluids.light.1-1.2l",
  "fluids.heavy.over-1.2l",
]
orange = [
  "cycle.high.light.45-15",
  "cycle.high.heavy.20-40",
  "no-lone-work",
  "no-unacclimatised",
  "fluids.over-1.2l",
  "high-risk-induction",
  "personal-water-bottle-2l",
]
red = ["stop-work"]

# ---- tunables -----------------------------------------------------------------------------------------------------

# Operating values that may change at runtime within [min, max] without a release (ADR 0010 section 4). `safer` names the
# more protective end; the prod pin check (ADR 0044) compares the less protective end and the default with the ruleset
# in force.

[tunables.twl_margin_w_m2]
source = "adr-0047"
default = 7.0
min = 7.0
max = 20.0
safer = "higher"

