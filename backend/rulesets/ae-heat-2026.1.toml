# Ruleset ae-heat-2026.1: the B3 ruleset (ADR 0011 sections 4 and 8, ADR 0046 to 0050, ADR 0058).
#
# RELEASED, so it is immutable: lock.json holds the SHA-256 of this file and the loader refuses to start when a byte
# differs. Its SHA-256 is a pre-registration freeze value (section 11.1). To change a value, add a new file with a new
# id that says `supersedes = ["ae-heat-2026.1"]`.
#
# It supersedes ae-heat-0.1 (which stays pinnable by id for audit replay, and which prod refuses to pin: ADR 0044) and
# adds labour-law windows, ADOSH Table 1 cycles, the acclimatization table, workload rates, privacy floors, the clause
# behind every planner rule, alert templates, and the B3 tunables. [twl_zones], [niosh_clothing] and [twl_withdrawal] are
# copied from ae-heat-0.1 unchanged (the withdrawal limits stay off, ADR 0047).
#
# Times in rulesets are written 12:30:00, not 12:30: TOML 1.0 (Python 3.13 tomllib) requires the seconds. A season is two
# zero-padded "MM-DD" local dates, both inclusive.
#
# Clause texts are copied from docs/research/2026-11-11-shift-regulations-and-sleep.md (the legal wording is quoted, not
# paraphrased). Where a rule is a product rule or a PROTECTIVE READING and not law, the clause says so and cites the ADR.

[meta]
id = "ae-heat-2026.1"
effective_from = 2024-01-01
# effective_to is omitted: open-ended. When set it is exclusive.
status = "released"
jurisdiction = "ae"
supersedes = ["ae-heat-0.1"]

