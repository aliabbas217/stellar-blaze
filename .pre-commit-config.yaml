# Install every stage once with `uv run --project backend pre-commit install` (the types below are the defaults).
# Every `rev` is a commit SHA with its tag in a `# frozen:` comment (what `pre-commit autoupdate --freeze` writes): a tag can
# be moved to other code, a SHA cannot. Bump with `uv run --project backend pre-commit autoupdate --freeze`, and the
# gitleaks version in .github/workflows/ci.yml with it (its sha256 too).
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # docs/research/ is archived evidence (recorded results and the scripts that produced them): the whitespace and
      # EOF fixers would rewrite it, so they skip it. It is excluded from ruff below for the same reason.
      - id: trailing-whitespace
        exclude: &research ^docs/research/
      - id: end-of-file-fixer
        exclude: *research
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
        exclude: &pnpmlock ^frontend/pnpm-lock\.yaml$
      # pnpm 11+ writes pnpm-lock.yaml as two YAML documents (the env lockfile, then the package lockfile), so the
      # lockfile alone is checked with multi-document support; every other YAML file stays single-document.
      - id: check-yaml
        name: check yaml (pnpm lockfile, multi-document)
        args: [--allow-multiple-documents]
        files: *pnpmlock
      - id: check-toml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: *research
      # ruff-pre-commit v0.17.4 also feeds Markdown to `ruff format` by default (it rewrites fenced Python blocks, which
      # reformatted a quoted test snippet in a plan document), so Markdown is dropped from types_or.
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: *research

  - repo: local
    hooks:
      # `uv run --project` does not change the working directory and mypy only reads config from the working
      # directory (and its parents), so `--directory backend` is what makes backend/pyproject.toml [tool.mypy] apply.
      - id: mypy
        name: mypy (strict, backend)
        entry: uv run --directory backend mypy src tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c  # frozen: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
      - id: commitizen-branch
        stages: [pre-push]
