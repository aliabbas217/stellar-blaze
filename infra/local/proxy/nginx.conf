# The proxy of the local production rehearsal: it stands for the Azure Container Apps ingress in front of `web`.
#
# What matters is X-Forwarded-For. `$proxy_add_x_forwarded_for` APPENDS the address nginx saw the request from to whatever
# the caller sent, so a caller who forges `X-Forwarded-For: 1.2.3.4` arrives at web as `1.2.3.4, <real address>`, and the
# BFF (TRUSTED_PROXY_HOPS=1, frontend/README.md) keys its per-client rate limit on the rightmost entry, the one this proxy
# wrote. Microsoft documents the real ingress as providing only the rightmost entry (ingress-overview); this emulates that
# behaviour, it is not the same software.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  server_tokens off;

  # Docker's embedded DNS. With a variable in proxy_pass nginx resolves the name per request instead of once at start-up,
  # so the proxy survives a web container that is recreated with a new address.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
